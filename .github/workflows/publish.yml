name: Publish to npm

# Publishes the package when you push a version tag, e.g.:
#   npm version patch   # bumps package.json + creates the tag
#   git push --follow-tags
#
# Requires a repo secret NPM_TOKEN (npmjs.com → Access Tokens → Granular or
# Automation token with publish rights for `dendra`; granular tokens can be
# scoped to this one package).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DENDRA_PG_URL: postgres://postgres:pg@localhost:5432/postgres
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      # Build first: the tests include ones that load dist/.
      - run: npm run build
      - run: npm run check:package
      - run: npm test
      - name: Publish if this version is new
        run: |
          VER=$(node -p "require('./package.json').version")
          # npm staging can lag a minute after a manual publish — poll before deciding.
          for i in 1 2 3 4 5 6; do
            if npm view "dendra@$VER" version >/dev/null 2>&1; then
              echo "dendra@$VER is already on npm — skipping publish."
              exit 0
            fi
            sleep 15
          done
          echo "dendra@$VER not found after polling — publishing."
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
