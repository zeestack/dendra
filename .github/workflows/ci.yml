name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Every Node.js line in active or maintenance LTS (see the versioning policy).
    strategy:
      matrix:
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DENDRA_PG_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The built package as users install it: exports map, types for CJS and ESM.
      - run: npm run check:package
      - run: npm test

  # The example app against this commit's package, packed the way npm ships
  # it — so it catches what the unit tests can't (exports, CJS/ESM, Next).
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nextjs-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: npm ci
        working-directory: examples/nextjs-app
      - run: npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/dendra-*.tgz
        working-directory: examples/nextjs-app
      - run: npm test
        working-directory: examples/nextjs-app
      # Before tsc: it writes next-env.d.ts (not committed), which types CSS modules.
      - run: npx next build
        working-directory: examples/nextjs-app
      # The whole project, including tests and the standalone servers.
      - run: npx tsc --noEmit
        working-directory: examples/nextjs-app

  # Performance baselines (bench/README.md): fails if bundle size, throughput,
  # latency or cold start regress past bench/baseline.json.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p bench
      - run: npm run bench
